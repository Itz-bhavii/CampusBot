spring.application.name=training
# spring.h2.console.enabled=true

#postgres
spring.datasource.url=jdbc:postgresql://localhost:5433/campusbot
spring.datasource.username=user
spring.datasource.password=password
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.sql.init.mode=always

# hibernate
spring.jpa.hibernate.ddl-auto=update


# ===================================================================
# MINIO CONFIGURATION
# ===================================================================
# Local development defaults - will be overridden by env vars in Docker
minio.endpoint=${MINIO_URL:http://localhost:9000}
minio.access.key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret.key=${MINIO_SECRET_KEY:minioadmin}

# rabbitmq
logging.level.org.springframework.security=DEBUG
# ===================================================================
# RABBITMQ CONFIGURATION
# ===================================================================
# Local development defaults - will be overridden by env vars in Docker
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.publisher-confirm-type= correlated
spring.rabbitmq.publisher-returns= true
